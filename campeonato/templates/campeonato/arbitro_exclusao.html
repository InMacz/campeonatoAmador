{% extends "campeonato/base.html" %}

{% block conteudo %}
    <form method="post">
        {% csrf_token %}
        <p>Tem certeza que deseja excluir o árbitro {{arbitro}}? As partidas dele continuam cadastradas, só ficam sem árbitro.</p>
        <button type="submit" class="botao-perigo">{{btn}}</button>
    </form>
    <a href="{% url 'listaArbitros' %}">Cancelar</a>
{% endblock %}
