{% extends "campeonato/base.html" %}

{% block conteudo %}
    <form method="post">
        {% csrf_token %}
        <p>Tem certeza que deseja excluir o jogador {{jogador}}? Os gols dele também serão excluídos.</p>
        <button type="submit" class="botao-perigo">{{btn}}</button>
    </form>
    <a href="{% url 'listaJogadores' %}">Cancelar</a>
{% endblock %}
