{% extends "campeonato/base.html" %}

{% block conteudo %}
    <form method="post">
        {% csrf_token %}
        <p>Tem certeza que deseja excluir o time {{time}}? Os jogadores e as partidas dele também serão excluídos.</p>
        <button type="submit" class="botao-perigo">{{btn}}</button>
    </form>
    <a href="{% url 'listaTimes' %}">Cancelar</a>
{% endblock %}
